# Seminário de Observabilidade — Tema 3: Logs estruturados e centralizados
# Subir tudo:  docker compose up -d --build
name: observabilidade-logs

# Configuração comum aos serviços da aplicação
x-app: &app
  build: .
  image: observabilidade-logs-app:latest
  restart: unless-stopped
  labels:
    observabilidade.logs: "true"   # o Alloy só coleta contêineres com este rótulo
  environment: &app-env
    LOG_FORMAT: ${LOG_FORMAT:-json}   # "texto" = modo "antes", sem estrutura
    LOG_LEVEL: INFO
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ---------------- Aplicação (4 serviços, 5 contêineres) ----------------
  gateway:
    <<: *app
    command: ["python", "-m", "app.run", "gateway"]
    environment:
      <<: *app-env
      SERVICE_NAME: gateway
      SERVICE_VERSION: 2.3.0
      PEDIDOS_URL: http://pedidos:8000
    ports:
      - "8080:8000"
    depends_on:
      pedidos: { condition: service_healthy }

  pedidos:
    <<: *app
    command: ["python", "-m", "app.run", "pedidos"]
    environment:
      <<: *app-env
      SERVICE_NAME: pedidos
      SERVICE_VERSION: 3.1.2
      ESTOQUE_URL: http://estoque:8000
      PAGAMENTOS_URL: http://pagamentos:8000
    depends_on:
      estoque: { condition: service_healthy }
      pagamentos: { condition: service_healthy }

  estoque:
    <<: *app
    command: ["python", "-m", "app.run", "estoque"]
    environment:
      <<: *app-env
      SERVICE_NAME: estoque
      SERVICE_VERSION: 1.8.0

  pagamentos:
    <<: *app
    command: ["python", "-m", "app.run", "pagamentos"]
    deploy:
      replicas: 2          # duas réplicas: a falha atinge só uma delas
    environment:
      <<: *app-env
      SERVICE_NAME: pagamentos
      SERVICE_VERSION: 1.4.0

  loadgen:
    build: .
    image: observabilidade-logs-app:latest
    restart: unless-stopped
    command: ["python", "-m", "app.loadgen"]
    environment:
      GATEWAY_URL: http://gateway:8000
      RPS: ${RPS:-4}
    depends_on:
      gateway: { condition: service_healthy }

  # ---------------- Observabilidade ----------------
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.9.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"   # UI do Alloy: grafo do pipeline de coleta
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs-loja.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
