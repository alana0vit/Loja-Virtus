apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 1000
      # Transforma o trace_id de qualquer linha num link clicável que
      # busca a mesma requisição em TODOS os serviços ("$$" escapa o $ do provisionamento)
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          datasourceUid: loki
          url: '{service=~".+"} | trace_id="$${__value.raw}" | json'
          urlDisplayLabel: "Ver esta requisição em todos os serviços"
